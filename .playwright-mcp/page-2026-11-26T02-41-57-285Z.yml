1 sebesar 3,076%. Hasil rata-rata daya serap air pada batako berbahan pasir pada hari ke-7, hari ke-14, dan hari ke-21 sebesar 2,820 %. Tabel 4.5 Hasil Analisis Perbandingan Pengujian Daya Serap Air Batako No. Material Batako Daya Serap Air (%) Kelayakan Berdasarkan Tipe 1 Botol Kaca 4,166 % Kelayakan Tipe I 2 Styrofoam 12,254 % Kelayakan Tipe I 3 Daun Ketapang Kering 1,839 % Kelayakan Tipe I 4 Pasir 2,820 % Kelayakan Tipe I Berdasarkan tabel 4.5 menunjukkan bahwa daya serap air pada batako berbahan dasar botol kaca, styrofoam, daun ketapang kering, dan pasir memiliki daya serap air rata-rata secara berurutan sebesar 4,166%, 12,254%, 1,893%, dan 2,820%. Jika ditinjau dari tabel 2.2, maka data kelayakan berdasarkan tipe yang terdapat pada tabel 4.5 menunjukkan bahwa semua material batako dianggap layak dengan kelayakan tipe I. Tabel 4.6 Hasil Pengujian Kuat Tekan Batako Berbahan Dasar Limbah Bahan Umur (hari) Ukuran (cm²) Berat (Kg) Beban P (KN) Beban Kalibrasi (Kg) Kuat Tekan (Kg/cm²) Angka Korelasi Kuat Tekan 28 Hari (Kg/cm²) Botol Kaca 21 135 1,00 286,3 29174 216,10 0,95 227,48 Styrofoam 21 135 0,50 8,8 897 6,64 0,95 6,99 Daun Kering 21 135 1,30 78,4 7989 59,18 0,95 62,29 Pasir 21 135 1,20 75,7 7714 57,14 0,95 60,15 Berdasarkan percobaan yang peneliti lakukan didapatkan data seperti pada tabel 4.6. Data kuat tekan batako diambil pada hari pengeringan batako ke-21 dan memiliki ukuran yang sama yakni 135 cm2. Berdasarkan tabel dapat diketahui bahwa pada hari ke-21, kuat tekan batako botol kaca, batako styrofoam, batako daun kering, dan batako pasir secara berurutan adalah 216,10 kg/cm², 6,64 kg/cm², 59,18 kg/cm², dan 57,14 kg/cm². Tabel 4.7 Hasil Analisis Perbandingan Pengujian Kuat Tekan Batako No. Material Batako Kuat Tekan Batako (Kg/cm²) (Umur 21 Hari) Kelayakan Berdasarkan Tipe 1 Botol Kaca 216,10 Kelayakan Tipe I 2 Styrofoam 6,64 Tidak Layak 3 Daun Ketapang Kering 59,18 Kelayakan Tipe III 4 Pasir 57,14 Kelayakan Tipe III Berdasarkan tabel 4.7 menunjukkan bahwa kuat tekan pada batako berbahan dasar botol kaca, styrofoam, daun ketapang kering, dan pasir memiliki kuat tekan secara berurutan sebesar 216,10 Kg/cm², 6,64 Kg/cm², 59,18 Kg/cm², dan 57,14 Kg/cm². Jika ditinjau dari tabel 2.2, maka data kelayakan berdasarkan tipe yang terdapat pada tabel 4.5 menunjukkan bahwa material botol kaca dikategorikan layak dengan kelayakan tipe I, material daun ketapang kering dan pasir dikategorikan layak dengan kelayakan tipe III, dan material styrofoam dikategorikan tidak layak. 2. Pembahasan 1. Analisis Uji Daya Serap Air Daya serap air merupakan parameter uji sifat fisis dari batako. Pengujian ini bertujuan untuk melihat banyak pori - pori yang ada pada batako. Semakin banyak pori - pori yang terkandung dalam batako maka akan semakin besar pula penyerapan air sehingga ketahanannya akan berkurang. Rongga atau pori - pori yang terdapat dalam batako terjadi karena kurang tepatnya kualitas dan komposisi material penyusunnya. Pengaruh rasio yang terlalu besar dapat menyebabkan rongga karena terdapat air yang tidak bereaksi dan kemudian menguap dan meninggalkan rongga (Hermanto, dkk., 2014). Dari percobaan ini, analisa pengujian daya serap air pada batako dari material botol kaca, styrofoam, daun kering, dan pasir disajikan sebagai berikut. 1. Percobaan I Botol Kaca Berdasarkan tabel 4.1 ditunjukkan hasil dari percobaan analisis uji daya serap air pada batako berbahan dasar limbah botol kaca sebesar 4,166%. Jika ditinjau dari tabel 2.2 tentang standar SNI 03-0349-1989 mengenai syarat kelayakan daya serap air batako, maka batako dari bahan botol kaca dianggap layak dengan kelayakan tipe I dimana kekuatan serap air batako maksimum sebesar 25%. Jika dilihat dari data daya serap air pada batako botol kaca, batako berbahan botol kaca memiliki daya serap air yang rendah. Hal ini dikarenakan bahan kaca tidak mudah menyerap air, maka batako berbahan kaca umumnya memiliki daya serap air yang sangat rendah. Hal ini didukung pernyataan Hanafiah (2011) yang mengemukakan bahwa kaca merupakan bahan yang tidak menyerap air atau zero water absorption. Maka dari itu dengan sifat kaca yang tidak menyerap air dapat mengisi rongga-rongga pada batako secara maksimal sehingga batako bersifat kedap air. Sifat tidak mudah menyerap air pada bahan kaca ini membuat batako berbahan kaca lebih tahan terhadap kerusakan akibat kelembaban atau air. Hal ini mengindikasikan bahwa batako berbahan kaca sangat cocok digunakan sebagai bahan bangunan pada area dengan kelembaban yang tinggi seperti kamar mandi, kolam renang, dan area-area basah lainnya. 2. Percobaan II Styrofoam Berdasarkan tabel 4.2 menunjukkan hasil dari percobaan analisis uji daya serap air pada batako berbahan dasar limbah styrofoam sebesar 12,254%. Jika ditinjau dari tabel 2.2 tentang standar SNI 03-0349-1989 mengenai syarat kelayakan daya serap air batako, maka batako dari bahan styrofoam dianggap layak dengan kelayakan tipe I dimana kekuatan serap air batako maksimum sebesar 25%. Batako berbahan styrofoam memiliki daya serap air yang rendah, namun lebih tinggi daripada material lainnya. Hal ini karena butiran styrofoam yang terdapat dalam campuran batako memiliki sifat hidrofobik atau tahan air, sehingga mampu mencegah penetrasi air ke dalam batako. Selain itu, butiran styrofoam juga berfungsi sebagai bahan isolasi yang dapat membantu menjaga suhu di dalam bangunan agar tetap stabil. Dari data dapat diketahui juga bahwa batako dari bahan styrofoam memiliki daya serap air yang lebih tinggi dari material botol kaca, daun, dan pasir. Hal ini didukung oleh pendapat Wijoseno (2008) dalam Simbolon (2009) yang menyatakan bahwa gelembung-gelembung udara yang terperangkap di dalam batako atau yang berada di dalam styrofoam akan mengurangi volume batako dan membuat batako menjadi lebih ringan. Hal ini mengakibatkan banyak gelembung udara yang terdapat dalam styrofoam sehingga daya serap air dalam batako styrofoam memiliki persentase yang lebih tinggi diantara material lainnya. Dengan kekuatan daya serap air yang rendah, hal ini menjadi keunggulan dari batako berbahan styrofoam karena lebih awet dan lebih tahan terhadap kerusakan yang diakibatkan dari paparan air dalam jangka waktu yang lama. 3. Percobaan III Daun Ketapang Kering Berdasarkan tabel 4.3 menunjukkan hasil dari percobaan analisis uji daya serap air pada batako berbahan dasar limbah daun ketapang kering sebesar 1,839%. Jika ditinjau dari tabel 2.2 tentang standar SNI 03-0349-1989 mengenai syarat kelayakan daya serap air batako, maka batako dari bahan daun kering dianggap layak dengan kelayakan tipe I dimana kekuatan serap air batako maksimum sebesar 25%. Batako berbahan daun memiliki daya serap air yang rendah, karena serat daun yang digunakan memiliki sifat hidrofobik, yaitu sifat yang membuat serat tidak mudah menyerap air. Dalam hal ini, batako berbahan daun lebih tahan terhadap kelembaban dan mempertahankan kekuatannya meski terpapar air dalam jangka waktu yang cukup lama. Kelebihan batako berbahan daun dengan daya serap air yang rendah cocok digunakan untuk bangunan yang membutuhkan ketahanan terhadap kelembaban dan air dalam jangka waktu yang lama. 4. Percobaan IV Pasir Berdasarkan tabel 4.4 menunjukkan hasil dari percobaan analisis uji daya serap air pada batako berbahan dasar pasir sebesar 2,820%. Jika ditinjau dari tabel 2.2 tentang standar SNI 03-0349-1989 mengenai syarat kelayakan daya serap air batako, maka batako dari bahan pasir dianggap layak dengan kelayakan tipe I dimana kekuatan serap air batako maksimum sebesar 25%. Pada umumnya, batako berbahan pasir memiliki daya serap air yang cukup tinggi karena karakteristik pasir mempunyai tekstur yang kasar. Pada batako berbahan pasir, terdapat ruang pori-pori yang besar diantara butiran-butirannya sehingga batako dapat menyerap air secara mudah. Pasir yang terdapat dalam campuran batako memiliki sifat hidrofilik atau mudah menyerap air, sehingga batako berbahan pasir dapat menyerap air dengan mudah. Apabila batako terpapar air dalam waktu yang lama, maka daya serap air yang tinggi ini dapat menyebabkan batako menjadi rusak dan mengalami kerusakan struktural. Namun jika ditinjau dari data yang peneliti dapatkan pada tabel 4.4, batako berbahan pasir memiliki daya serap air yang cukup rendah, hal ini dikarenakan daya serap air pada batako juga dipengaruhi oleh faktor lain seperti proses produksi batako, proporsi campuran bahan-bahan, serta kondisi lingkungan tempat batako disimpan. 2. Analisis Uji Kuat Tekan Kekuatan tekan merupakan salah satu kinerja utama batako. Kekuatan tekan adalah kemampuan batako untuk menerima gaya tekan per satuan luas. Penentuan kekuatan tekan dapat dilakukan dengan menggunakan alat uji tekan dan benda uji silinder atau kubus. Nilai kekuatan tekan yang diperoleh dari setiap sampel akan berbeda, karena batako merupakan material heterogen, yang kekuatan tekannya dipengaruhi oleh proporsi campuran, bentuk dan ukuran, kecepatan pembebanan, dan oleh kondisi lingkungan pada saat pengujian. Dari percobaan ini, analisa pengujian kuat tekan pada batako dari material botol kaca, styrofoam, daun kering, dan pasir disajikan sebagai berikut. 1. Percobaan I Botol Kaca Berdasarkan tabel 4.6 menunjukkan hasil dari percobaan analisis uji kuat tekan pada batako berbahan dasar botol kaca sebesar 216,10 kg/cm2. Jika ditinjau dari tabel 2.2 tentang standar SNI 03-0349-1989 mengenai syarat kelayakan kuat tekan batako, maka batako dari bahan botol kaca dianggap layak dengan kelayakan tipe I dimana kekuatan kuat tekan batako minimum sebesar 90 Kg/cm². Batako berbahan kaca baik dalam menahan tekanan karena bahan kaca memiliki sifat yang keras dan tahan terhadap tekanan. Hal ini disebabkan karena unsur kaca memiliki daya ikat yang baik dan tidak mudah terkikis, sehingga dapat meningkatkan kekuatan batako. Batako berbahan botol kaca memiliki daya kuat tekan yang baik hal ini dikarenakan kesamaan unsur semen portland dan unsur serbuk kaca terlihat pada tabel 2.1 dan tabel 2.3. Dari kedua tabel tersebut terlihat kesamaan unsur silica (SiO2) pada unsur semen yakni sebesar 17%-25% dan pada unsur serbuk kaca sebesar 97,0080%. Kesamaan unsur ini menyebabkan serbuk kaca berperan sama seperti semen saat bereaksi dengan air yakni dengan mengikat butiran agregat sehingga terbentuk suatu massa padat yang dapat mengisi rongga udara dalam butiran agregat. Berdasarkan standar SNI 15-0302-1989, bahan yang memiliki sifat pozzolan adalah bahan yang mengandung silika dengan bentuk yang halus. Ketika dicampur dengan air, senyawa-senyawa ini akan bereaksi secara kimia dengan kalsium hidroksida pada suhu kamar dan membentuk senyawa yang memiliki sifat yang mirip dengan semen. Hal ini menyebabkan peningkatan kekuatan karena semakin besar penambahan unsur silica maka terjadi penambahan kompleks CaO . ySiO2 . nH2O yang dikandung oleh batako. Walaupun memiliki daya kuat tekan yang baik, batako berbahan kaca biasanya lebih mahal dibandingkan dengan jenis batako lainnya karena bahan kaca merupakan bahan yang relatif sulit didapatkan dan proses produksinya membutuhkan teknologi khusus. 2. Percobaan II Styrofoam Berdasarkan tabel 4.6 menunjukkan hasil dari percobaan analisis uji kuat tekan pada batako berbahan dasar styrofoam sebesar 6,64 kg/cm2. Jika ditinjau dari tabel 2.2 tentang standar SNI 03-0349-1989 mengenai syarat kelayakan kuat tekan batako, maka batako dari bahan styrofoam dikategorikan tidak layak, hal ini dikarenakan batako yang dianggap layak harus memiliki kekuatan kuat tekan minimum sebesar 21 Kg/cm² agar dapat dikategorikan kelayakan tipe IV. Kekuatan kuat batako styrofoam yang rendah disebabkan oleh sifat dasar styrofoam yang terbuat dari bahan utama polistirena yaitu bahan polimer yang ringan dan mudah terkompresi, sehingga penggunaan limbah styrofoam dapat membuat banyak rongga udara yang menjadikan batako lebih ringan. Batako berbahan styrofoam memiliki daya kuat tekan yang relatif rendah disebabkan oleh sifat-sifat styrofoam yang lunak dan mudah terkompresi, sehingga tidak mampu menahan tekanan dengan baik. Dari hasil penelitian Saputro (2014) disebutkan bahwa semakin banyak persentase penambahan styrofoam ke dalam campuran batako maka akan menurunkan kuat tekannya. Hal tersebut disebabkan angka porositas yang semakin besar seiring bertambahnya kadar styrofoam. Dikarenakan kekuatan batako berbahan styrofoam cenderung lebih rendah, batako berbahan styrofoam tidak direkomendasikan untuk digunakan pada bangunan yang membutuhkan kekuatan dan ketahanan yang sangat tinggi. Meskipun demikian, batako berbahan styrofoam memiliki keuntungan dalam penggunaannya sebagai bahan bangunan. Batako ini ringan, mudah dipasang, dan memiliki sifat isolasi termal yang baik, sehingga cocok digunakan untuk bangunan yang membutuhkan isolasi termal seperti gedung perkantoran, pusat perbelanjaan, atau rumah tinggal. 3. Percobaan III Daun Ketapang Kering Berdasarkan tabel 4.6 menunjukkan hasil dari percobaan analisis uji kuat tekan pada batako berbahan dasar daun kering sebesar 59,18 kg/cm2. Jika ditinjau dari tabel 2.2 tentang standar SNI 03-0349-1989 mengenai syarat kelayakan kuat tekan batako, maka batako dari bahan daun kering dianggap layak dengan kelayakan tipe III dimana kekuatan kuat tekan batako minimum sebesar 35 Kg/cm². Batako dari limbah daun ketapang kering memiliki daya kuat tekan yang cukup baik yang disebabkan oleh kandungan dalam daun ketapang kering yang berupa kandungan tanin terhidrolisis dengan konsentrasi tinggi. Senyawa tanin pada batako berbahan limbah daun ketapang kering dapat berfungsi untuk mengikat dan mengendapkan semen dalam batako untuk merekatkan komponen yang ada di dalam semen. Bahan dasar pembuatan batako berbahan daun adalah limbah daun yang diolah dengan teknologi yang tepat, sehingga menghasilkan bahan yang cukup padat dan kuat. Namun, karena bahan dasarnya berupa serat alami, struktur batako berbahan daun cenderung lebih renggang sehingga kuat tekan batako berbahan daun kurang optimal. Namun, kelebihan batako berbahan daun adalah ramah lingkungan karena terbuat dari bahan alami dan mudah didaur ulang. Selain itu, batako berbahan daun juga memiliki sifat isolasi termal yang baik, sehingga dapat membantu menjaga suhu di dalam bangunan. Oleh karena itu, batako berbahan daun masih sering digunakan dalam bangunan yang memperhatikan aspek lingkungan dan keberlanjutan. 4. Percobaan IV Pasir Berdasarkan tabel 4.6 menunjukkan hasil dari percobaan analisis uji kuat tekan pada batako berbahan dasar pasir sebesar 57,14 kg/cm2. Jika ditinjau dari tabel 2.2 tentang standar SNI 03-0349-1989 mengenai syarat kelayakan kuat tekan batako, maka batako dari bahan pasir dianggap layak dengan kelayakan tipe III dimana kekuatan kuat tekan batako minimum sebesar 35 kg/cm². Daya kuat tekan pada batako pasir cukup baik, hal ini dikarenakan pasir merupakan material utama untuk menahan beban tekan dalam batako dan untuk merekatkan semen. Bahan pasir memiliki sifat-sifat mekanik yang memungkinkan batako terbentuk dengan rapat dan padat. Pencampuran pasir dengan semen dan air menghasilkan adukan yang cukup padat dan kering, sehingga setelah dikeringkan, batako pasir menjadi cukup kuat dan tahan terhadap beban. Selain itu, batako pasir juga memiliki pori-pori yang baik untuk sirkulasi udara dan pengurangan kelembaban, sehingga membuatnya cocok untuk aplikasi konstruksi pada bangunan. Pasir memiliki kandungan mineral utama yaitu silika (SiO2), yang merupakan mineral yang umumnya ditemukan pada tanah. Silika ini memiliki struktur kristal yang kuat dan tahan lama, sehingga membuat pasir cocok untuk digunakan sebagai bahan batako. Terlebih lagi, pasir juga memiliki sifat yang ringan, mudah diproses, dan tahan terhadap perubahan cuaca. Kandungan mineral lainnya dalam pasir seperti aluminium, besi, kalsium, dan magnesium, juga dapat memberikan kekuatan tambahan pada batako yang dibuat dari pasir. Oleh karena itu, pasir menjadi bahan dasar yang ideal untuk pembuatan batako yang memiliki daya tahan yang baik. BAB V KESIMPULAN DAN SARAN 1. Kesimpulan Dari hasil penelitian dan pembahasan yang telah diuraikan sebelumnya, dapat diambil beberapa kesimpulan sebagai berikut : 1. Pengujian daya serap air pada sampel batako dengan komposisi limbah botol kaca, limbah styrofoam, limbah daun ketapang kering, dan pasir berturut-turut adalah 4,166%, 12,254%, 1,839%, 2,820%. Oleh karena itu, semua material bahan dikategorikan layak dengan kelayakan tipe I. 2. Pengujian kuat tekan pada sampel batako dengan komposisi limbah botol kaca, limbah styrofoam, limbah daun ketapang kering, dan pasir berturut - turut adalah 216,10 Kg/cm², 6,64 Kg/cm², 59,18 Kg/cm², dan 57,14 Kg/cm². Oleh karena itu, material limbah kaca dikategorikan layak dengan kelayakan tipe I, material limbah daun ketapang kering dan pasir dikategorikan layak dengan kelayakan tipe III. Terakhir, material limbah styrofoam dikategorikan tidak layak. 2. Saran Untuk memperoleh kesempurnaan dan hasil yang lebih baik lagi untuk penelitian selanjutnya, dengan ini peneliti mengharapkan : 1. Perlu adanya penelitian lebih lanjut dari proyek ini terkait ukuran dan perbandingan komposisi limbah yang berbeda dari batako. 2. Perlu adanya penelitian lebih lanjut terkait daya tahan dari batako berbahan dasar limbah botol kaca, daun ketapang kering, dan styrofoam. 3. Perlu adanya penelitian lebih lanjut terkait mutu dari batako berbahan dasar limbah botol kaca, daun ketapang kering, dan styrofoam. DAFTAR PUSTAKA Adreansyah, dkk. 2019. “Uji Tekan dan Daya Serap Air pada Batako Berbahan Dasar Campuran Limbah Styrofoam, Serat Kelapa, dan Abu Gosok”. Jurnal Sains, Teknologi, Sosial, Pendidikan, dan Bahasa, Vol. 4, No. 1, hlm. 11-14. Hermanto, Dony, dkk. 2014. Kuat Tekan Batako Dengan Variasi Bahan Tambah Serat Ijuk. Skripsi. Surakarta: Program Studi Jurusan Teknik Sipil, Fakultas Teknik, Universitas Sebelas Maret. Hussein, Muhamad. 2020. Perilaku Penjual Limbah Padat Ditinjau dari Etika Bisnis Islam. Skripsi. Kediri: Program Studi Ekonomi Syariah, Fakultas Ekonomi dan Bisnis Islam, Institut Agama Islam Negeri Kediri. Jumiati, Ety. 2021. Pembuatan Batako Konvensional dengan Pemanfaatan Limbah Kertas. Tugas Akhir. Medan: Lembaga Penelitian dan Pengabdian kepada Masyarakat, Universitas Islam Negeri Sumatera Utara Medan. Justin, Joshua. 2015. “Eksplorasi Limbah Kaca”. e-Proceeding of Art & Design, Vol. 2, No. 2, hlm. 908. Lestari, Dwi Marga. 2017. Uji Kandungan Fenol dan Aktivitas Antioksidan Ekstrak Daun Gayam (Inocarpus fagiferus) sebagai Sumber Belajar Biologi. Skripsi. Malang: Program Studi S1 Pendidikan Biologi, Jurusan Pendidikan Matematika dan Ilmu Pengetahuan Alam, Fakultas Keguruan dan Ilmu Pendidikan, Universitas Muhammadiyah Malang. Nursyamsi, dkk. 2016. “Pemanfaatan Serbuk Kaca sebagai Bahan Tambah dalam Pembuatan Batako”. Media Teknik Sipil, Vol. 14, No. 1, hlm. 84-95. Syahza, Almasdi. 2018. “Seminar Nasional Pembangunan Pertanian dan Pedesaan”. Jurnal Agrikultur, Vol. 1, No. 1, hlm 1-7. Syaifuddin. 2018. Pembuatan dan Pengujian Kuat Tekan Batako dengan Penambahan Limbah Tulang Ikan. Skripsi. Makassar: Program Studi S1 Jurusan Fisika, Fakultas Sains dan Teknologi, Universitas Islam Negeri Alauddin Makassar. Umar, Muhammad Zakaria, dkk. 2017. “Daya Serap Air pada Batako Beton dari Bahan Pasir Pohara dan Nambo”, Seminar Nasional Riset Kuantitatif Terapan, Vol. 1, No. 1, hlm. 128-129. Wariyatno, Nanang Gunawan, dan Yanuar Haryanto. 2013. “Kuat Tekan dan Kuat Tarik belah sebagai nilai estimasi kekuatan sisa pada beton serat kasa aluminium akibat variasi suhu”. Dinamika Rekayasa, Vol. 9, No. 1, hlm. 23. Winarno, Heru, dan Rully Pujantara. 2015. “Pengaruh Komposisi Bahan Pengisi Styrofoam pada Batako Mortar Semen ditinjau dari Karakteristik dan Kuat Tekan”. Jurnal Scientific PINISI, Vol.1, No.1, hlm. 1-6. LAMPIRAN Link Slide Presentasi : https://www.canva.com/design/DAFfnZ1tJmk/16CclIDqEXHzqVeQ_B9nEQ/edit?utm_content=DAFfnZ1tJmk&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutt